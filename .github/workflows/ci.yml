name: WEIGHTTRAP CI — Autonomous Control Plane Verification Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  unit-and-integration-tests:
    name: 🛡️ Automated Fast QA Suite (38 Tests across Matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 Check out repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 🧪 Run Automated 6-Engine QA Suite (38 Tests)
      run: |
        python run_all_tests.py

    - name: 📄 Verify Standalone CLI Tool
      run: |
        python cli.py --help
        python cli.py test

    - name: 📑 Verify Schema Compliance & Audit Dossier
      run: |
        python -m unittest tests/test_schema_validation.py
        python cli.py audit --model razorpay_fraud_scorer_v2.1 --output reports/ci_audit.html
        test -f reports/ci_audit.html

  empirical-benchmarks:
    name: 🔬 Scientific Empirical Benchmark Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
    - name: 📥 Check out repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔬 Execute 4 Empirical Benchmark Experiments
      run: |
        python benchmarks/run_complete_evaluation.py
